services:
  lab_migration_global:
    class: '\Drupal\lab_migration\Services\LabMigrationGlobalfunction'
    arguments:
      - '@database'
      - '@messenger'
      - '@current_user'
      - '@module_handler'
      - '@file_system'
      - '@lab_migration.mail_service'

  lab_migration.mail_service:
    class: '\Drupal\lab_migration\Services\MailService'
    arguments: ['@plugin.manager.mail', '@logger.factory', '@config.factory', '@language_manager']

  lab_migration.ajax_helper:
    class: '\Drupal\lab_migration\Services\AjaxHelper'
    arguments: ['@renderer']